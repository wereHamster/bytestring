name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Refusing to publish from $GITHUB_REF, a v* tag is required" >&2
            exit 1
          fi

          gh release view "$GITHUB_REF_NAME" > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---------------------------------------------------------------------
      # Setup

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix run .#nix-develop .#workflow
      - run: pnpm install

      # ---------------------------------------------------------------------
      # Build

      - run: ./node_modules/.bin/tsc

      # ---------------------------------------------------------------------
      # Publish

      - run: pnpm stage publish --registry https://registry.npmjs.org --access public --no-git-checks
