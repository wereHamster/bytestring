name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(jq -r .version package.json)
          previous=$(git show "$BEFORE:package.json" 2>/dev/null | jq -r .version || true)

          if [ "$version" = "$previous" ]; then
            echo "Version is still $version, nothing to release"
            exit 0
          fi

          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists"
            exit 0
          fi

          notes="$RUNNER_TEMP/notes.md"
          awk -v a="## $version" -v b="## v$version" '$0 == a || $0 == b { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "No release notes for $version in CHANGELOG.md" >&2
            exit 1
          fi

          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$notes"
          gh workflow run publish.yml --ref "v$version"
